<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PathwayEd</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#003078; --navy-deep:#00245C; --orange:#CC543C; --orange-deep:#B0432E;
  --paper:#FBF8F3; --surface:#FFFFFF; --ink:#1C2230; --muted:#5A6172; --faint:#9aa1ad;
  --line:#ECE4D8; --line-2:#F3ECE0; --grow:#1F9E6F; --grow-soft:#E7F5EF;
  --math:#2E5BB8; --reading:#1F9E6F; --writing:#8B5CD6; --science:#E8943A;
  --shadow:0 1px 2px rgba(28,34,48,.04),0 10px 30px rgba(28,34,48,.07);
  --shadow-lg:0 16px 50px rgba(28,34,48,.14);
  --r:20px; --r-sm:14px;
  --disp:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:var(--body);background:var(--paper);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
#app{min-height:100dvh;display:flex;flex-direction:column}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink)}
h1,h2,h3{font-family:var(--disp);font-weight:700;margin:0;letter-spacing:-.01em;color:var(--navy)}
.wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px 22px;width:100%}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);width:100%;max-width:480px;padding:34px}
.kicker{color:var(--orange);font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-family:var(--body)}
.muted{color:var(--muted)}.center{text-align:center}
.logo-full{width:min(300px,74%);height:auto;display:block;margin:2px auto 0}
.markimg{height:30px;width:auto;display:block}
.field{margin:16px 0;text-align:left}
.field label{display:block;font-weight:600;font-size:14px;margin-bottom:7px}
.input{width:100%;padding:14px 16px;border:1.6px solid var(--line);border-radius:var(--r-sm);background:#fff;transition:border-color .15s,box-shadow .15s}
.input:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 4px rgba(0,48,120,.08)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:15px 22px;border-radius:999px;font-weight:700;font-size:15.5px;transition:transform .08s,box-shadow .16s,background .15s,opacity .15s;width:100%;font-family:var(--body)}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--orange);color:#fff}.btn-primary:hover{box-shadow:0 8px 22px rgba(204,84,60,.36)}
.btn-navy{background:var(--navy);color:#fff}
.btn-soft{background:#F4EEE4;color:var(--navy)}.btn-soft:hover{background:#EFE7DA}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn-ghost{background:none;color:var(--muted);width:auto;padding:10px 14px;font-weight:600}
.link{background:none;color:var(--navy);font-weight:700;width:auto;padding:4px;text-decoration:underline;text-underline-offset:3px;font-family:var(--body);font-size:14.5px}
.err{color:#C0492F;font-size:14px;font-weight:500;min-height:18px;margin-top:8px}
.sso{display:flex;align-items:center;justify-content:center;gap:11px;width:100%;padding:14px 18px;border:1.6px solid var(--line);border-radius:999px;background:#fff;font-weight:600;font-size:15px;margin-bottom:11px;transition:.14s;color:var(--ink)}
.sso:hover{border-color:#cdd3dc;box-shadow:var(--shadow)}
.sso svg{width:20px;height:20px;flex-shrink:0}
.orb{position:relative;width:92px;height:92px;border-radius:50%;background:radial-gradient(circle at 36% 30%,#F3B6A4 0%,var(--orange) 54%,var(--orange-deep) 100%);box-shadow:0 12px 30px rgba(176,67,46,.34);display:flex;align-items:center;justify-content:center;margin:0 auto;animation:breathe 4.8s ease-in-out infinite}
.orb::after{content:"";position:absolute;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.55);top:17px;left:20px;filter:blur(3px)}
.orb.sm{width:42px;height:42px;animation-duration:5.2s}
.orb.sm::after{width:12px;height:12px;top:8px;left:9px;filter:blur(2px)}
.orb.thinking{animation:think 1.5s ease-in-out infinite}
.orb.speaking{animation:speak 1s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@keyframes think{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(204,84,60,.4),0 12px 30px rgba(176,67,46,.3)}50%{transform:scale(1.06);box-shadow:0 0 0 13px rgba(204,84,60,0),0 12px 30px rgba(176,67,46,.3)}}
@keyframes speak{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.navatar{width:92px;height:92px;border-radius:50%;overflow:hidden;margin:0 auto;position:relative;box-shadow:0 12px 30px rgba(28,34,48,.2)}
.navatar img{width:100%;height:100%;object-fit:cover;display:block}
.navatar.sm{width:42px;height:42px;box-shadow:0 4px 12px rgba(28,34,48,.18)}
.navatar.thinking{animation:navpulse 1.4s ease-in-out infinite}
.navatar.speaking{animation:navpulse .9s ease-in-out infinite}
.navatar.thinking::after,.navatar.speaking::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2.5px solid var(--orange);animation:navring 1.2s ease-out infinite}
@keyframes navpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes navring{0%{opacity:.55;transform:scale(1)}100%{opacity:0;transform:scale(1.28)}}
.navgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.navopt{display:flex;flex-direction:column;align-items:center;gap:9px;padding:16px 10px;border:1.6px solid var(--line);border-radius:var(--r);background:#fff;font-weight:700;font-size:13px;color:var(--ink);transition:.14s}
.navopt:hover{border-color:#cdd3dc}
.navopt.on{border-color:var(--orange);background:#FBEEE9}
.navopt .orb.sm,.navopt .navatar.sm{width:66px;height:66px}
.input-err{border-color:#C0492F!important;box-shadow:0 0 0 4px rgba(192,73,47,.12)!important}
.callstage{display:flex;flex-direction:column;align-items:center;gap:7px;padding:24px 12px 18px;background:radial-gradient(120% 100% at 50% 0,#0C2A52 0,#061325 68%,#03080f 100%);border-bottom:1px solid #0a1f3d}
.callname{font-family:var(--disp);font-weight:700;color:#EAF0FA;font-size:16px;letter-spacing:.04em}
.navstatus{font-size:12px;color:#93A8C8;letter-spacing:.06em}
.callphoto{width:296px;height:296px;border-radius:40px;overflow:hidden;box-shadow:var(--shadow-lg);position:relative;background:#eee}
.callphoto img{width:100%;height:100%;object-fit:cover;display:block}
.callphoto.thinking{animation:navpulse 1.5s ease-in-out infinite}
.callphoto.speaking{animation:navpulse .85s ease-in-out infinite}
.callphoto.thinking::after,.callphoto.speaking::after{content:"";position:absolute;inset:0;border-radius:40px;border:3px solid var(--orange);animation:navring 1.2s ease-out infinite}
.orbbig{position:relative;width:296px;height:296px;display:flex;align-items:center;justify-content:center}
.orbbig .core{width:160px;height:160px;border-radius:50%;background:radial-gradient(circle at 36% 30%,#F3B6A4,var(--orange) 55%,var(--orange-deep));box-shadow:0 0 60px rgba(204,84,60,.45);animation:breathe 4s ease-in-out infinite;z-index:2}
.orbbig .ring{position:absolute;border-radius:50%;box-sizing:border-box}
.orbbig .r1{inset:28px;border:2px solid rgba(204,84,60,.4);animation:spin 9s linear infinite}
.orbbig .r2{inset:60px;border:2px dashed rgba(0,48,120,.32);animation:spin 6s linear infinite reverse}
.orbbig .r3{inset:0;border:2px solid rgba(204,84,60,.16);animation:opulse 3.2s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes opulse{0%,100%{transform:scale(.96);opacity:.55}50%{transform:scale(1.05);opacity:.15}}
.orbbig.thinking .core{animation:breathe 1.1s ease-in-out infinite;box-shadow:0 0 78px rgba(204,84,60,.7)}
.orbbig.thinking .r1{animation-duration:3s}.orbbig.thinking .r2{animation-duration:2.2s}
.orbbig.speaking .core{animation:speakbig .5s ease-in-out infinite;box-shadow:0 0 90px rgba(204,84,60,.8)}
@keyframes speakbig{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
@media(max-width:760px){.callstage{padding:14px 10px 10px}.callphoto,.orbbig{width:232px;height:232px}}
.jarvis{display:block;width:100%;height:100%}
.jorb{width:92px;height:92px;margin:0 auto}.jorb.sm{width:42px;height:42px}
.navopt .jthumb{width:66px;height:66px}
.jspin-cw,.jspin-ccw,.jarcA,.jarcB,.jswirl,.jglow,.jcore{transform-box:view-box;transform-origin:100px 100px}
.jspin-cw{animation:spin 26s linear infinite}
.jspin-ccw{animation:spin 34s linear infinite reverse}
.jarcA{animation:spin 16s linear infinite}
.jarcB{animation:spin 22s linear infinite reverse}
.jswirl{animation:spin 9s linear infinite}
.jglow{animation:jglowp 3.4s ease-in-out infinite}
.jcore{animation:jcorep 3.4s ease-in-out infinite}
@keyframes jglowp{0%,100%{opacity:.38;transform:scale(.88)}50%{opacity:.95;transform:scale(1.2)}}
@keyframes jcorep{0%,100%{transform:scale(.8)}50%{transform:scale(1.26)}}
@keyframes jpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.orbbig.thinking{animation:jpulse 1.8s ease-in-out infinite}
.orbbig.thinking .jarcA{animation-duration:8s}.orbbig.thinking .jarcB{animation-duration:11s}
.orbbig.thinking .jspin-cw{animation-duration:14s}.orbbig.thinking .jspin-ccw{animation-duration:18s}
.orbbig.thinking .jglow,.orbbig.thinking .jcore{animation-duration:1.5s}
.orbbig.speaking{animation:jpulse .7s ease-in-out infinite}
.orbbig.speaking .jarcA{animation-duration:5s}.orbbig.speaking .jarcB{animation-duration:7s}
.orbbig.speaking .jswirl{animation-duration:4s}
.orbbig.speaking .jspin-cw{animation-duration:9s}.orbbig.speaking .jspin-ccw{animation-duration:12s}
.orbbig.speaking .jglow,.orbbig.speaking .jcore{animation-duration:.42s}
.jping{transform-box:view-box;transform-origin:100px 100px;animation:jping 2.6s ease-out infinite}
.jping2{animation-delay:1.3s}
@keyframes jping{0%{transform:scale(.5);opacity:.6}70%{opacity:.12}100%{transform:scale(1.75);opacity:0}}
.orbbig.thinking .jping{animation-duration:1.8s}
.orbbig.speaking .jping{animation-duration:1.1s}
@media (prefers-reduced-motion:reduce){.jspin-cw,.jspin-ccw,.jarcA,.jarcB,.jswirl,.jglow,.jcore,.jping,.orbbig.thinking,.orbbig.speaking{animation:none!important}}
.consent-list{list-style:none;padding:0;margin:18px 0}
.consent-list li{position:relative;padding:11px 0 11px 28px;font-size:14.5px;color:var(--muted);border-top:1px solid var(--line-2)}
.consent-list li:first-child{border-top:none}
.consent-list li b{color:var(--ink);font-weight:700}
.consent-list li::before{content:"";position:absolute;left:3px;top:17px;width:9px;height:9px;border-radius:50%;background:var(--orange)}
.check{display:flex;gap:13px;align-items:flex-start;padding:16px;background:#FBEEE9;border:1px solid #F0D4CA;border-radius:var(--r-sm);margin:14px 0 6px;cursor:pointer}
.check input{margin-top:2px;width:21px;height:21px;accent-color:var(--orange);flex-shrink:0}
.check span{font-size:14.5px;font-weight:600}
.kid-card{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;border:1.6px solid var(--line);border-radius:var(--r);padding:16px;transition:transform .1s,box-shadow .18s,border-color .15s;margin-bottom:12px}
.kid-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.kid-av{width:54px;height:54px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:800;font-size:22px;color:#fff;flex-shrink:0}
.kid-meta .nm{font-family:var(--disp);font-weight:700;font-size:18px;line-height:1.1;color:var(--navy)}
.kid-meta .sub{font-size:13px;color:var(--muted);margin-top:2px}
.opt{display:block;width:100%;text-align:left;border:1.6px solid var(--line);border-radius:var(--r-sm);padding:14px 16px;margin-bottom:10px;background:#fff;transition:.14s}
.opt:hover{border-color:var(--navy)}.opt.on{border-color:var(--orange);background:#FBEEE9}
.opt .ol{font-weight:700;font-size:15px}.opt .od{font-size:13px;color:var(--muted);margin-top:2px}
.shell{flex:1;width:100%;max-width:720px;margin:0 auto;padding:24px 22px 40px}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.brandmark{display:flex;align-items:center;gap:9px;font-family:var(--disp);font-weight:800;color:var(--navy);font-size:18px}
.menuwrap{position:relative}
.menubtn{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--navy);border:1.6px solid var(--line);background:#fff;transition:.14s}
.menubtn:hover{background:#F7F2EA}
.menu{position:absolute;right:0;top:calc(100% + 8px);background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);padding:6px;min-width:196px;z-index:30;display:none}
.menu.open{display:block}
.menu button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:11px 12px;border-radius:10px;font-weight:600;font-size:14.5px;color:var(--ink);font-family:var(--body)}
.menu button:hover{background:#F4EEE4}.menu button svg{color:var(--muted);flex-shrink:0}
.greet{font-size:32px;line-height:1.12;margin:16px 0 2px}
.subjects{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}
.subject{position:relative;text-align:left;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px;transition:transform .1s,box-shadow .18s;overflow:hidden}
.subject:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.subject .ico{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.subject h3{font-size:20px;margin-bottom:3px}.subject p{margin:0;font-size:13.5px;color:var(--muted)}
.subject .resume,.bigcard .resume{position:absolute;top:15px;right:15px;font-size:11px;font-weight:700;color:var(--grow);background:var(--grow-soft);padding:3px 9px;border-radius:999px}
.bigcard{position:relative;display:flex;align-items:center;gap:16px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-top:14px;transition:transform .1s,box-shadow .18s}
.bigcard:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.bigcard .ico{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.bigcard h3{font-size:18px;margin:0 0 2px}.bigcard p{margin:0;font-size:13.5px;color:var(--muted)}
.session{display:flex;flex-direction:column;height:100dvh;width:100%;background:var(--paper)}
.shead{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--line);background:rgba(251,248,243,.92);backdrop-filter:blur(8px);z-index:6}
.shead .who{flex:1;min-width:0}
.shead .s1{font-family:var(--disp);font-weight:700;font-size:16px;line-height:1.1;color:var(--navy)}
.shead .s2{font-size:12px;color:var(--muted)}
.iconbtn{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1.6px solid var(--line);background:#fff;color:var(--muted);flex-shrink:0}
.iconbtn.on{background:var(--orange);border-color:var(--orange);color:#fff}
.panetabs{display:none;gap:6px;padding:8px 14px;border-bottom:1px solid var(--line);background:#fff}
.panetabs button{flex:1;padding:9px;border-radius:10px;font-weight:700;font-size:13.5px;color:var(--muted);background:#F4EEE4}
.panetabs button.on{background:var(--navy);color:#fff}
.work{flex:1;display:flex;min-height:0}
.chatpane{flex:1;display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--line)}
.wspane{width:46%;max-width:540px;display:flex;flex-direction:column;min-width:0;background:#fff}
.feed{flex:1;overflow-y:auto;padding:20px 16px 8px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:88%;padding:12px 15px;border-radius:18px;font-size:15px;white-space:pre-wrap;word-wrap:break-word}
.msg.nikki{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:6px}
.msg.me{align-self:flex-end;background:var(--navy);color:#fff;border-bottom-right-radius:6px}
.typing{align-self:flex-start;display:flex;gap:5px;padding:14px 18px;background:#fff;border:1px solid var(--line);border-radius:18px;border-bottom-left-radius:6px}
.typing i{width:8px;height:8px;border-radius:50%;background:var(--orange);opacity:.5;animation:dot 1.2s infinite}
.typing i:nth-child(2){animation-delay:.18s}.typing i:nth-child(3){animation-delay:.36s}
@keyframes dot{0%,60%,100%{opacity:.35}30%{opacity:1}}
.composer{padding:11px 12px;border-top:1px solid var(--line);background:var(--surface);display:flex;gap:9px;align-items:flex-end}
.composer textarea{flex:1;resize:none;max-height:120px;padding:11px 14px;border:1.6px solid var(--line);border-radius:18px;line-height:1.4}
.composer textarea:focus{outline:none;border-color:var(--navy)}
.send{width:44px;height:44px;border-radius:50%;background:var(--orange);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.send[disabled]{opacity:.4}
.wstabs{display:flex;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line)}
.wstabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 4px;border-radius:12px;font-weight:700;font-size:12px;color:var(--muted);background:#F7F2EA;transition:.14s}
.wstabs button.on{background:var(--navy);color:#fff}
.wsbody{flex:1;overflow-y:auto;padding:16px}
.wshint{font-size:13px;color:var(--muted);margin:0 0 12px}
.note-tools{display:flex;gap:8px;align-items:center;margin-bottom:10px}.note-tools .sp{flex:1}
.chip{padding:8px 13px;border-radius:999px;background:#F4EEE4;font-weight:700;font-size:13px;color:var(--navy)}
.seg{display:flex;gap:6px;background:#F4EEE4;padding:4px;border-radius:12px;margin-bottom:12px}
.seg-b{flex:1;padding:9px;border-radius:9px;font-weight:700;font-size:13.5px;color:var(--muted)}
.seg-b.on{background:#fff;color:var(--navy);box-shadow:var(--shadow)}
.bigtype{width:100%;min-height:240px;padding:14px 16px;border:1.6px solid var(--line);border-radius:var(--r-sm);resize:vertical;line-height:1.55;font-size:15px}
.bigtype:focus{outline:none;border-color:var(--navy)}
.mathbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.mathbar button{min-width:36px;height:36px;padding:0 8px;border:1.6px solid var(--line);border-radius:9px;background:#fff;font-weight:700;font-size:15px;color:var(--navy)}
.mathbar button:hover{background:#F7F2EA}
.mathcats{display:flex;gap:6px;overflow-x:auto;margin-bottom:8px;padding-bottom:2px}
.mcat{flex:0 0 auto;padding:7px 12px;border-radius:999px;background:#F4EEE4;font-weight:700;font-size:12.5px;color:var(--muted);white-space:nowrap}
.mcat.on{background:var(--navy);color:#fff}
.oranote{text-align:center;color:var(--faint);font-size:12px;margin:12px 0}
canvas.pad{width:100%;height:260px;border:1.6px dashed #D9CBB6;border-radius:var(--r-sm);background:#FFFDF8;touch-action:none;display:block}
.flash{perspective:1200px;height:220px;margin:6px 0 12px}
.flash-inner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
.flash-inner.flip{transform:rotateY(180deg)}
.flash-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--r);display:flex;align-items:center;justify-content:center;text-align:center;padding:22px;font-weight:600;box-shadow:var(--shadow)}
.flash-front{background:#fff;border:1.6px solid var(--line);color:var(--ink);font-size:18px}
.flash-back{background:var(--navy);color:#fff;transform:rotateY(180deg);font-size:16px}
.flash-nav{display:flex;align-items:center;justify-content:space-between;gap:10px}
.flash-nav .cnt{font-size:13px;color:var(--muted);font-weight:600}
.upbox{border:1.8px dashed #D9CBB6;border-radius:var(--r);padding:26px 18px;text-align:center;background:#FFFDF8}
.upbox .upi{width:46px;height:46px;border-radius:14px;background:#F4EEE4;display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
.preview{margin-top:6px;border-radius:var(--r-sm);overflow:hidden;border:1px solid var(--line)}
.preview img{width:100%;display:block}
.rate{display:flex;gap:10px;margin:18px 0}
.rate button{flex:1;padding:16px 8px;border:1.6px solid var(--line);border-radius:var(--r-sm);background:#fff;font-weight:700;font-size:14px;display:flex;flex-direction:column;gap:7px;align-items:center;transition:.15s;font-family:var(--body)}
.rate button .face{font-size:26px}.rate button.on{border-color:var(--orange);background:#FBEEE9}
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-bottom:14px}
.panel h3{font-size:17px;margin-bottom:8px}
.stat-row{display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line-2);font-size:14px}
.stat-row:first-of-type{border-top:none}
.banner{font-size:12.5px;color:var(--muted);background:#EEF2FA;border-radius:12px;padding:10px 14px;margin-top:16px;text-align:center}
.foot{text-align:center;font-size:12px;color:var(--faint);padding:16px}
@media (prefers-reduced-motion:reduce){.orb,.orb.thinking,.orb.speaking,.typing i,.flash-inner{animation:none!important;transition:none!important}}
@media(max-width:760px){
  .panetabs{display:flex}
  .work[data-pane="chat"] .wspane{display:none}
  .work[data-pane="work"] .chatpane{display:none}
  .chatpane,.wspane{width:100%;max-width:none;border-right:none}
  .subjects{grid-template-columns:1fr}.greet{font-size:27px}.card{padding:28px 22px}
}

function wireMenu(){
  const btn=document.getElementById("menubtn"),menu=document.getElementById("menu");
  if(!btn)return;
  btn.onclick=e=>{e.stopPropagation();const open=menu.classList.toggle("open");btn.setAttribute("aria-expanded",open)};
  document.querySelectorAll("#menu [data-go]").forEach(b=>b.onclick=()=>{menu.classList.remove("open");state.screen=b.dataset.go;render()});
}

- When ${k.name} shares written or drawn work or a photo, read it carefully, point out what is going well, and gently guide the next step. If you cannot read something, say so kindly and ask them to tell you.

- Only help with learning and school. If ${k.name} drifts off topic, kindly steer back.

function paintFeed(){

async function nikkiCall(messages,system){
  const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1000,system,messages})});

}
function histText(){return state.messages.map(m=>({role:m.role,content:m.content}))}
async function sendMsg(text){
  const ta=document.getElementById("ta");

  if(!content||state.busy)return;
  if(ta){ta.value="";ta.style.height="auto"}
  state.messages.push({role:"user",content});state.busy=true;paintFeed();
  try{
    const reply=await nikkiCall(histText(),systemPrompt())||"Let's try that again. Can you tell me a little more?";
    state.messages.push({role:"assistant",content:reply});
    await sset("pe_tx_"+state.activeKid.id+"_"+state.subject,state.messages.slice(-40));
    state.busy=false;paintFeed();if(state.readAloud)speak(reply);
  }catch(e){state.busy=false;state.messages.push({role:"assistant",content:"I'm having a little trouble connecting right now. Let's try once more in a moment."});paintFeed();}
}

  try{
    const msgs=[...histText().slice(0,-1),{role:"user",content:[{type:"image",source:{type:"base64",media_type:"image/png",data:b64}},{type:"text",text:promptText}]}];

      paintSyms();
      document.querySelectorAll("[data-cat]").forEach(c=>c.onclick=()=>{state.ws.mathset=c.dataset.cat;document.querySelectorAll("[data-cat]").forEach(x=>x.classList.toggle("on",x===c));paintSyms()});
    }
  }
  document.getElementById("checkwork").onclick=()=>{
    if((state.ws.noteMode||"type")==="draw"){
      if(state.ws.noteImg){sendImageTurn(state.ws.noteImg.split(",")[1],"(I shared a photo of my work)","Here is a photo of the work I did by hand. Please read it, tell me what looks good, and help me with the next step.");}
      else if(state.ws.hasInk){const c=document.getElementById("pad");sendImageTurn(c.toDataURL("image/png").split(",")[1],"(I shared my handwritten work)","Here is the work I wrote by hand. Please read it, tell me what looks good, and help me with the next step.");}
    }else{
      const t=(state.ws.typed||"").trim();
      if(t){sendMsg(t);state.pane="chat";rSession();}
      else{const ta=document.getElementById("typed");if(ta)ta.focus();}
    }
  };
}
function setupPad(c){
  const dpr=window.devicePixelRatio||1,rect=c.getBoundingClientRect();
  c.width=rect.width*dpr;c.height=rect.height*dpr;
  const ctx=c.getContext("2d");ctx.scale(dpr,dpr);
  ctx.lineWidth=2.6;ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle="#1C2230";
  if(state.ws.noteData){const img=new Image();img.onload=()=>ctx.drawImage(img,0,0,rect.width,rect.height);img.src=state.ws.noteData;}
  let drawing=false,lx=0,ly=0;
  function pos(e){const r=c.getBoundingClientRect();const p=e.touches?e.touches[0]:e;return [p.clientX-r.left,p.clientY-r.top]}
  function down(e){e.preventDefault();drawing=true;[lx,ly]=pos(e)}
  function move(e){if(!drawing)return;e.preventDefault();const [x,y]=pos(e);ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(x,y);ctx.stroke();[lx,ly]=[x,y];state.ws.hasInk=true}
  function up(){if(!drawing)return;drawing=false;state.ws.noteData=c.toDataURL("image/png")}
  c.addEventListener("mousedown",down);c.addEventListener("mousemove",move);window.addEventListener("mouseup",up);
  c.addEventListener("touchstart",down,{passive:false});c.addEventListener("touchmove",move,{passive:false});c.addEventListener("touchend",up);
}
function isElementary(){const g=state.activeKid&&state.activeKid.grade;return g==="K"||(parseInt(g,10)<=5)}
function parseCards(raw){let t=String(raw).replace(/```json|```/g,"").trim();const s=t.indexOf("["),e=t.lastIndexOf("]");if(s>=0&&e>s)t=t.slice(s,e+1);return JSON.parse(t).filter(c=>c&&c.front&&c.back)}
function renderCards(b){
  const cards=state.ws.cards;
  if(!cards.length){
    if(state.ws.cardImg){
      b.innerHTML=`<p class="wshint">Here are your words. Make a flashcard set from this, or choose a different picture.</p>
        <div class="preview"><img src="${state.ws.cardImg}"></div>
        <button class="btn btn-navy" id="genimg" style="margin-top:12px">Make flashcards from this</button>
        <button class="link" id="rmcimg" style="display:block;margin:10px auto 0">Choose a different one</button>
        <div class="err" id="cerr"></div>`;
      document.getElementById("genimg").onclick=()=>genCardsFromImage();
      document.getElementById("rmcimg").onclick=()=>{state.ws.cardImg=null;renderWorkspace()};
      return;
    }
    b.innerHTML=`<p class="wshint">Flashcards for sight words and vocabulary. Type a word list or topic, or take a picture or upload a photo or PDF of words or an assignment and Nikki will turn it into a set.</p>
      <div class="field" style="margin-top:0"><label for="topic">Words or topic (optional)</label><input id="topic" class="input" placeholder="e.g. sight words, or: cat, dog, run" value="${esc(state.ws.topic)}"></div>
      <button class="btn btn-navy" id="gen">Make flashcards</button>
      <div class="oranote">or</div>
      <button class="btn btn-soft" id="upc">\ud83d\udcf7 Take or upload a picture or PDF of words</button>
      <input id="cfile" type="file" accept="image/*,application/pdf" style="display:none">
      <div class="err" id="cerr"></div>`;
    document.getElementById("gen").onclick=()=>genCards();
    const cf=document.getElementById("cfile");
    document.getElementById("upc").onclick=()=>cf.click();
    cf.onchange=async()=>{const f=cf.files[0];if(!f)return;const er=document.getElementById("cerr");try{if(f.type==="application/pdf"){er.textContent="Reading your PDF...";state.ws.cardText=await extractPdfText(f);state.ws.cardImg=null;await genCardsFromText();}else{er.textContent="Loading your picture...";state.ws.cardImg=await fileToDataURL(f);renderWorkspace();}}catch(e){er.textContent="I couldn't open that file. A clear photo or a text PDF works best.";}};
    return;
  }
  const i=state.ws.cardIdx,card=cards[i];
  b.innerHTML=`<div class="flash"><div class="flash-inner ${state.ws.flipped?"flip":""}" id="flip">
      <div class="flash-face flash-front">${esc(card.front)}</div>
      <div class="flash-face flash-back">${esc(card.back)}</div></div></div>
    <p class="center" style="margin:0 0 10px"><button class="chip" id="say">\ud83d\udd0a Hear the word</button> <span class="muted" style="font-size:12px">Tap card to flip</span></p>
    <div class="flash-nav"><button class="chip" id="prev">\u2039 Back</button><span class="cnt">${i+1} of ${cards.length}</span><button class="chip" id="next">Next \u203a</button></div>
    <button class="link" id="new" style="display:block;margin:16px auto 0">Make a new set</button>`;
  document.getElementById("say").onclick=()=>speak(card.front);
  document.getElementById("flip").onclick=()=>{state.ws.flipped=!state.ws.flipped;renderWorkspace()};
  document.getElementById("prev").onclick=()=>{state.ws.cardIdx=(i-1+cards.length)%cards.length;state.ws.flipped=false;renderWorkspace()};
  document.getElementById("next").onclick=()=>{state.ws.cardIdx=(i+1)%cards.length;state.ws.flipped=false;renderWorkspace()};
  document.getElementById("new").onclick=()=>{state.ws.cards=[];state.ws.cardIdx=0;state.ws.flipped=false;renderWorkspace()};
}
function parseWords(text){
  if(!text)return [];
  let w=[];const re=/\d+[\.\)]\s*([A-Za-z][A-Za-z'\-]{1,})/g;let m;
  while((m=re.exec(text)))w.push(m[1]);
  if(w.length<3)w=text.split(/[\n,;\u2022]+/).map(s=>s.trim()).filter(s=>s&&/[A-Za-z]/.test(s)&&s.length<28);
  return [...new Set(w)].slice(0,24);
}
function offlineCards(text){return parseWords(text).map(w=>({front:w,back:"Say it aloud, then tell Nikki what it means and use it in a sentence."}))}
async function genCards(){
  const inp=document.getElementById("topic");if(inp)state.ws.topic=inp.value.trim();
  const btn=document.getElementById("gen");if(btn){btn.disabled=true;btn.textContent="Making your cards..."}
  const band=isElementary()?"This is an elementary student in grade K to 5: use sight words and simple vocabulary words.":"This is a student in grade 6 to 12: use vocabulary words with clear definitions.";
  const sys=`You create word-study flashcards for a student in ${workingDesc()}. ${band} Respond with ONLY a JSON array of exactly 8 objects, each {"front":"the word","back":"a simple kid-friendly meaning and a short example sentence using the word"}. Accurate, age-appropriate, no markdown, no extra text.`;
  const topic=state.ws.topic?(" using these words or topic: "+state.ws.topic):"";
  try{
    const raw=await nikkiCall([{role:"user",content:"Make 8 flashcards"+topic}],sys);
    state.ws.cards=parseCards(raw).slice(0,8);
    state.ws.cardIdx=0;state.ws.flipped=false;renderWorkspace();
  }catch(e){const fb=offlineCards(state.ws.topic);if(fb.length){state.ws.cards=fb;state.ws.cardIdx=0;state.ws.flipped=false;renderWorkspace();}else{const er=document.getElementById("cerr");if(er)er.textContent="Couldn't make cards just now. Try again in a moment.";if(btn){btn.disabled=false;btn.textContent="Make flashcards"}}}
}
async function genCardsFromImage(){
  const btn=document.getElementById("genimg");if(btn){btn.disabled=true;btn.textContent="Making your cards..."}
  const er=document.getElementById("cerr");if(er)er.textContent="";
  if(!state.ws.cardImg)return;
  const b64=state.ws.cardImg.split(",")[1];
  const band=isElementary()?"This is an elementary student in grade K to 5: use sight words and simple vocabulary.":"This is a student in grade 6 to 12: use vocabulary words with clear definitions.";
  const sys=`You create word-study flashcards for a student in ${workingDesc()}. ${band} Look at the photo, find the words or terms the student wants to study, and make one flashcard per word, up to 12. Respond with ONLY a JSON array of objects {"front":"the word or term","back":"a simple kid-friendly meaning and a short example sentence using it"}. Accurate, age-appropriate, no markdown, no extra text.`;
  try{
    const raw=await nikkiCall([{role:"user",content:[{type:"image",source:{type:"base64",media_type:"image/png",data:b64}},{type:"text",text:"Make flashcards from these words."}]}],sys);
    state.ws.cards=parseCards(raw).slice(0,12);state.ws.cardImg=null;state.ws.cardIdx=0;state.ws.flipped=false;renderWorkspace();
  }catch(e){if(er)er.textContent="I couldn't read the words clearly. Try a clearer photo.";if(btn){btn.disabled=false;btn.textContent="Make flashcards from this"}}
}
async function genCardsFromText(){
  const er=document.getElementById("cerr");if(er)er.textContent="Making your cards...";
  const band=isElementary()?"This is an elementary student in grade K to 5: keep meanings and sentences simple.":"This is a student in grade 6 to 12: use clear, accurate definitions.";
  const sys=`You create vocabulary flashcards for a student in ${workingDesc()}. ${band} You will be given a list of words or a study sheet. Make one flashcard per word, up to 20. Respond with ONLY a JSON array of objects {"front":"the word or term","back":"a simple kid-friendly meaning and a short example sentence using it"}. Accurate, age-appropriate, no markdown, no extra text.`;
  try{
    const raw=await nikkiCall([{role:"user",content:"Make flashcards from these words:\n"+(state.ws.cardText||"")}],sys);
    state.ws.cards=parseCards(raw).slice(0,20);state.ws.cardText=null;state.ws.cardIdx=0;state.ws.flipped=false;renderWorkspace();
  }catch(e){const fb=offlineCards(state.ws.cardText);if(fb.length){state.ws.cards=fb;state.ws.cardText=null;state.ws.cardIdx=0;state.ws.flipped=false;renderWorkspace();}else if(er)er.textContent="I couldn't read that file. Try a photo, or type the words.";}
}

    <div class="upbox">
      <div class="upi"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--navy)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></svg></div>
      <button class="btn btn-soft" id="pick" style="width:auto;margin:0 auto">Choose a photo or PDF</button>
      <input id="file" type="file" accept="image/*,application/pdf" style="display:none">

    ${img?`<div class="preview" style="margin-top:12px"><img src="${img}"></div><button class="btn btn-primary" id="usehw" style="margin-top:12px">Work on this with Nikki</button>`:""}
    <div class="err" id="herr"></div>`;

function fileToDataURL(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}
let pdfjsReady=null;
function loadPdfjs(){if(pdfjsReady)return pdfjsReady;pdfjsReady=new Promise((res,rej)=>{const sc=document.createElement("script");sc.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";sc.onload=()=>{try{window.pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";res(window.pdfjsLib)}catch(e){rej(e)}};sc.onerror=rej;document.head.appendChild(sc)});return pdfjsReady}
async function pdfFirstPage(f){const lib=await loadPdfjs();const buf=await f.arrayBuffer();const pdf=await lib.getDocument({data:buf}).promise;const page=await pdf.getPage(1);const vp=page.getViewport({scale:1.6});const c=document.createElement("canvas");c.width=vp.width;c.height=vp.height;await page.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;return c.toDataURL("image/png")}
async function extractPdfText(f){const lib=await loadPdfjs();const buf=await f.arrayBuffer();const pdf=await lib.getDocument({data:buf}).promise;let out="";const max=Math.min(pdf.numPages,6);for(let i=1;i<=max;i++){const page=await pdf.getPage(i);const tc=await page.getTextContent();out+=tc.items.map(it=>it.str).join(" ")+"\n";}return out.trim()}

function rFeedback(){

  app.innerHTML=`<div class="wrap"><div class="card center">

function nextBill(){const d=new Date();d.setMonth(d.getMonth()+1);return d.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"})}

function render(){
  stopSpeak();
  const r={welcome:rWelcome,consent:rConsent,kids:rKids,addkid:rAddKid,picker:rPicker,kidhome:rKidHome,session:rSession,feedback:rFeedback,parent:rParent,settings:rSettings,nikki:rNikki}[state.screen];
  if(r)r();
}
(async function init(){
  document.addEventListener("click",e=>{const m=document.getElementById("menu");if(m&&m.classList.contains("open")&&!e.target.closest(".menuwrap"))m.classList.remove("open")});
  const p=await sget("pe_parent");
  if(p&&p.consentAt){state.parent=p;state.kids=(await sget("pe_kids"))||[];state.screen=state.kids.length?"picker":"kids"}
  render();
})();
</script>
